name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install public release-test dependency
        run: python3 -m pip install --quiet 'cryptography==45.0.7'

      - name: Validate release scripts
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
          python3 -m py_compile scripts/release/*.py

  test-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host_arch: arm64
            xcode_arch: arm64
          - runner: macos-15-intel
            host_arch: x86_64
            xcode_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Run XCTest natively
        run: |
          xcodebuild test \
            -project Macsimize.xcodeproj \
            -scheme Macsimize \
            -destination 'platform=macOS' \
            ARCHS="${{ matrix.xcode_arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host_arch: arm64
            xcode_arch: arm64
            channel: stable
            product_name: Macsimize
            bundle_id: pzc.Macsimize
            app_icon: AppIcon
          - runner: macos-15
            host_arch: arm64
            xcode_arch: arm64
            channel: beta
            product_name: Macsimize Beta
            bundle_id: pzc.Macsimize.beta
            app_icon: AppIconBeta
          - runner: macos-15-intel
            host_arch: x86_64
            xcode_arch: x86_64
            channel: stable
            product_name: Macsimize
            bundle_id: pzc.Macsimize
            app_icon: AppIcon
          - runner: macos-15-intel
            host_arch: x86_64
            xcode_arch: x86_64
            channel: beta
            product_name: Macsimize Beta
            bundle_id: pzc.Macsimize.beta
            app_icon: AppIconBeta
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Build Macsimize (${{ matrix.channel }})
        run: |
          set -euo pipefail
          xcodebuild \
            -project Macsimize.xcodeproj \
            -scheme Macsimize \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            PRODUCT_NAME="${{ matrix.product_name }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.bundle_id }}" \
            ASSETCATALOG_COMPILER_APPICON_NAME="${{ matrix.app_icon }}" \
            ARCHS="${{ matrix.xcode_arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate Sparkle bundle layout (${{ matrix.channel }})
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/${{ matrix.product_name }}.app"
          python3 scripts/release/validate_sparkle_bundle.py --app-path "$APP_PATH"
          test "$(lipo -archs "$APP_PATH/Contents/MacOS/${{ matrix.product_name }}")" = "${{ matrix.xcode_arch }}"
