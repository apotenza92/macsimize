name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macsimize-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_core: ${{ steps.meta.outputs.version_core }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      build_number: ${{ steps.meta.outputs.build_number }}
      release_matrix: ${{ steps.meta.outputs.release_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Prove tag commit belongs to the approved release source
        env:
          APPROVED_RELEASE_BRANCH: main
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEFAULT_BRANCH" != "$APPROVED_RELEASE_BRANCH" ]]; then
            echo "::error::Repository default branch $DEFAULT_BRANCH is not approved release source $APPROVED_RELEASE_BRANCH"
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$RELEASE_SHA" ]]
          git show-ref --verify --quiet "refs/remotes/origin/$APPROVED_RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$APPROVED_RELEASE_BRANCH"; then
            echo "::error::Release tag $RELEASE_TAG does not belong to $APPROVED_RELEASE_BRANCH"
            exit 1
          fi

      - name: Parse tag metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            CORE_VERSION="$VERSION"
            PRERELEASE="false"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}"
            CORE_VERSION="${BASH_REMATCH[1]}"
            PRERELEASE="true"
          else
            echo "::error::Tag must match vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi

          PROJECT_VERSION="$(python3 -c 'import re, pathlib; text = pathlib.Path("Macsimize.xcodeproj/project.pbxproj").read_text(encoding="utf-8"); m = re.search(r"MARKETING_VERSION = ([0-9]+\.[0-9]+\.[0-9]+);", text); print(m.group(1) if m else "")')"

          if [[ "$PROJECT_VERSION" != "$CORE_VERSION" ]]; then
            echo "::error::Tag core version ($CORE_VERSION) must match MARKETING_VERSION ($PROJECT_VERSION)."
            exit 1
          fi

          BUILD_NUMBER="$(python3 -c 'import re,sys; tag=sys.argv[1]; m=re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?", tag); assert m; major,minor,patch=int(m.group(1)),int(m.group(2)),int(m.group(3)); prerelease=m.group(4); core=(major*1_000_000)+(minor*1_000)+patch; beta_match=(re.search(r"(?:beta|b)[.-]?(\d+)$", prerelease, flags=re.IGNORECASE) if prerelease else None); stage=(90_000 if prerelease is None else (min(max(int(beta_match.group(1)),1),89_999) if beta_match else 50_000)); print((core*100_000)+stage)' "$TAG")"
          RELEASE_MATRIX="$(python3 scripts/release/release_matrix.py --prerelease "$PRERELEASE")"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "version_core=$CORE_VERSION"
            echo "prerelease=$PRERELEASE"
            echo "build_number=$BUILD_NUMBER"
            echo "release_matrix=$RELEASE_MATRIX"
          } >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry exists
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notes_from_changelog.py --tag "${{ steps.meta.outputs.tag }}" > /dev/null

  build-macos:
    needs: prepare
    environment: release-signing
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Verify native runner
        shell: bash
        run: |
          expected="${{ matrix.xcode_arch }}"
          test "$(uname -m)" = "$expected"

      - name: Import signing certificate
        shell: bash
        env:
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 scripts/release/import_apple_signing.py install

      - name: Build signed app archive
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          VERSION_CORE: ${{ needs.prepare.outputs.version_core }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail

          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"

          ARCHIVE_PATH="$RUNNER_TEMP/${{ matrix.package_prefix }}-${{ matrix.arch }}.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export-${{ matrix.package_prefix }}-${{ matrix.arch }}"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/export-options-${{ matrix.package_prefix }}-${{ matrix.arch }}.plist"
          ARCHIVE_LOG="$RUNNER_TEMP/archive-${{ matrix.package_prefix }}-${{ matrix.arch }}.log"
          EXPORT_LOG="$RUNNER_TEMP/export-${{ matrix.package_prefix }}-${{ matrix.arch }}.log"

          run_with_timestamp_retry() {
            local log_path="$1"
            shift
            local max_attempts=3
            local attempt=1
            local status=0

            while [[ "$attempt" -le "$max_attempts" ]]; do
              echo "Running command (attempt ${attempt}/${max_attempts}): $*"
              set +e
              "$@" 2>&1 | tee "$log_path"
              status=${PIPESTATUS[0]}
              set -e

              if [[ "$status" -eq 0 ]]; then
                return 0
              fi

              if grep -qi "The timestamp service is not available" "$log_path" && [[ "$attempt" -lt "$max_attempts" ]]; then
                local sleep_seconds=$((attempt * 20))
                echo "::warning::Apple timestamp service unavailable; retrying in ${sleep_seconds}s."
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
                continue
              fi

              return "$status"
            done

            return "$status"
          }

          run_with_timestamp_retry "$ARCHIVE_LOG" xcodebuild \
            -project Macsimize.xcodeproj \
            -scheme Macsimize \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            ARCHS="${{ matrix.xcode_arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION_CORE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PRODUCT_NAME="${{ matrix.product_name }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.bundle_id }}" \
            ASSETCATALOG_COMPILER_APPICON_NAME="${{ matrix.app_icon }}" \
            SU_FEED_URL="https://raw.githubusercontent.com/apotenza92/macsimize/main/appcasts/${{ matrix.channel }}-${{ matrix.arch }}.xml" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${APPLE_SIGNING_IDENTITY}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          if ! run_with_timestamp_retry "$EXPORT_LOG" xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"; then
            if grep -qi "The timestamp service is not available" "$EXPORT_LOG"; then
              echo "::warning::Export failed after timestamp retries; using signed app directly from archive."
              mkdir -p "$EXPORT_PATH"
              cp -R "$ARCHIVE_PATH/Products/Applications/${{ matrix.product_name }}.app" "$EXPORT_PATH/${{ matrix.product_name }}.app"
            else
              exit 1
            fi
          fi

          APP_PATH="$EXPORT_PATH/${{ matrix.product_name }}.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Expected app bundle not found at $APP_PATH"
            exit 1
          fi

          python3 scripts/release/validate_sparkle_bundle.py --app-path "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          mkdir -p dist
          cp -R "$APP_PATH" "dist/${{ matrix.product_name }}.app"

      - name: Notarize and staple with notarytool
        shell: bash
        env:
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_NOTARYTOOL_KEY_ID"
          test -n "$APPLE_NOTARYTOOL_ISSUER_ID"
          test -n "$APPLE_NOTARYTOOL_KEY_P8_BASE64"

          NOTARY_DIR="$(mktemp -d "$RUNNER_TEMP/macsimize-notary.XXXXXX")"
          chmod 700 "$NOTARY_DIR"
          KEY_PATH="$NOTARY_DIR/AuthKey_${APPLE_NOTARYTOOL_KEY_ID}.p8"
          export KEY_PATH
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ["KEY_PATH"])
          path.write_bytes(base64.b64decode(os.environ["APPLE_NOTARYTOOL_KEY_P8_BASE64"], validate=True))
          path.chmod(0o600)
          PY

          APP_PATH="dist/${{ matrix.product_name }}.app"
          UPLOAD_ZIP="$NOTARY_DIR/notary-upload.zip"
          SUBMIT_JSON_PATH="$NOTARY_DIR/submit.json"
          NOTARY_LOG_PATH="$RUNNER_TEMP/notary-${{ matrix.channel }}-${{ matrix.arch }}.json"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$UPLOAD_ZIP"
          xcrun notarytool submit "$UPLOAD_ZIP" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARYTOOL_KEY_ID" \
            --issuer "$APPLE_NOTARYTOOL_ISSUER_ID" \
            --wait \
            --output-format json > "$SUBMIT_JSON_PATH"

          SUBMISSION_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("id", ""))' "$SUBMIT_JSON_PATH")"
          SUBMISSION_STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", ""))' "$SUBMIT_JSON_PATH")"

          if [[ -z "$SUBMISSION_ID" ]]; then
            echo "::error::Failed to parse notary submission ID"
            rm -rf "$NOTARY_DIR"
            exit 1
          fi

          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_NOTARYTOOL_KEY_ID" \
            --issuer "$APPLE_NOTARYTOOL_ISSUER_ID" \
            --output-format json > "$NOTARY_LOG_PATH"

          python3 - "$NOTARY_LOG_PATH" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          issues = data.get("issues") or []
          for issue in issues:
              severity = str(issue.get("severity", "warning")).lower()
              message = str(issue.get("message", "Unknown notarization issue"))
              print(f"::{severity if severity in {'warning', 'error'} else 'warning'}::{message}")
          if any(str(issue.get("severity", "")).lower() == "error" for issue in issues):
              raise SystemExit("Notarization log contains errors")
          PY

          if [[ "$SUBMISSION_STATUS" != "Accepted" ]]; then
            echo "::error::Notary submission status is '$SUBMISSION_STATUS' (expected 'Accepted')."
            rm -rf "$NOTARY_DIR"
            exit 1
          fi

          xcrun stapler staple -v "$APP_PATH"
          xcrun stapler validate -v "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          rm -rf "$NOTARY_DIR"

      - name: Package release zip
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          mkdir -p out
          PACKAGE="${{ matrix.package_prefix }}-v${VERSION}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.product_name }}.app" "out/$PACKAGE"
          unzip -tq "out/$PACKAGE"
          (cd out && shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256")
          python3 scripts/release/verify_macos_release.py \
            --zip-path "out/$PACKAGE" \
            --product-name "${{ matrix.product_name }}" \
            --bundle-id "${{ matrix.bundle_id }}" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --arch "${{ matrix.arch }}" \
            --app-icon "${{ matrix.app_icon }}" \
            --feed-url "https://raw.githubusercontent.com/apotenza92/macsimize/main/appcasts/${{ matrix.channel }}-${{ matrix.arch }}.xml" \
            --sparkle-public-key "N7RX+t85/TW2Qu4q6zTzyxT63d5v5VUN11AECEWsbcE=" \
            --signing-identity "$APPLE_SIGNING_IDENTITY" \
            --team-id "$APPLE_TEAM_ID" \
            --certificate-sha256 "$APPLE_SIGNING_CERTIFICATE_SHA256"
          ls -lah out

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: out/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos-${{ matrix.channel }}-${{ matrix.arch }}
          path: |
            out/*.zip
            out/*.sha256
          if-no-files-found: error

      - name: Upload notarization evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notarization-${{ matrix.channel }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/notary-${{ matrix.channel }}-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: python3 scripts/release/import_apple_signing.py cleanup

  create-draft-release:
    needs:
      - prepare
      - build-macos
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: dist

      - name: Build deterministic tap-owned Homebrew bundle from local candidate assets
        run: |
          python3 scripts/release/stage_homebrew_publication.py --tag "${{ needs.prepare.outputs.tag }}" --assets dist --output staged-homebrew
          python3 scripts/create-homebrew-archive.py staged-homebrew/publication dist/homebrew-publication.tar.gz
      - name: Attest the standard Homebrew publication bundle before publication
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/homebrew-publication.tar.gz

      - name: Create exact draft and verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_notes_from_changelog.py --tag "$TAG" > "$NOTES_FILE"

          VERSION="${TAG#v}"
          PREFIXES=(Macsimize-Beta)
          if [[ "$PRERELEASE" != "true" ]]; then
            PREFIXES=(Macsimize "${PREFIXES[@]}")
          fi
          EXPECTED=()
          for prefix in "${PREFIXES[@]}"; do
            for arch in arm64 x64; do
              EXPECTED+=("${prefix}-v${VERSION}-macos-${arch}.zip")
              EXPECTED+=("${prefix}-v${VERSION}-macos-${arch}.zip.sha256")
            done
          done
          EXPECTED+=(homebrew-publication.tar.gz)
          mapfile -t ACTUAL < <(find dist -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          mapfile -t SORTED_EXPECTED < <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort)
          if [[ "$(printf '%s\n' "${ACTUAL[@]}")" != "$(printf '%s\n' "${SORTED_EXPECTED[@]}")" ]]; then
            printf 'Expected assets:\n%s\nActual assets:\n%s\n' \
              "$(printf '%s\n' "${SORTED_EXPECTED[@]}")" "$(printf '%s\n' "${ACTUAL[@]}")"
            exit 1
          fi

          (cd dist && shasum -a 256 -c -- *.zip.sha256)
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to replace its assets automatically; use a new tag."
            exit 1
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES_FILE" --prerelease --repo "$GH_REPO"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES_FILE" --repo "$GH_REPO"
          fi
          gh release upload "$TAG" "${EXPECTED[@]/#/dist/}" --repo "$GH_REPO"

          mapfile -t REMOTE < <(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [[ "$(printf '%s\n' "${REMOTE[@]}")" != "$(printf '%s\n' "${SORTED_EXPECTED[@]}")" ]]; then
            echo "::error::Draft asset allowlist mismatch after upload."
            exit 1
          fi

          mkdir -p reviewed
          gh release download "$TAG" --repo "$GH_REPO" --dir reviewed
          mapfile -t REVIEWED < <(find reviewed -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)
          if [[ "$(printf '%s\n' "${REVIEWED[@]}")" != "$(printf '%s\n' "${SORTED_EXPECTED[@]}")" ]]; then
            echo "::error::Re-downloaded asset allowlist mismatch."
            exit 1
          fi
          for asset in "${EXPECTED[@]}"; do
            cmp "dist/$asset" "reviewed/$asset"
          done
          (cd reviewed && shasum -a 256 -c -- *.zip.sha256)

      - name: Preserve reviewed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-release-assets
          path: reviewed/*
          if-no-files-found: error

  sparkle-update-e2e:
    needs:
      - prepare
      - create-draft-release
    environment: sparkle-signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Download reviewed candidate assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-release-assets
          path: reviewed

      - name: Resolve pinned Sparkle source and build official CLI
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Macsimize.xcodeproj
          SPARKLE_SOURCE="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/SourcePackages/checkouts/Sparkle' -type d -print -quit)"
          test -n "$SPARKLE_SOURCE"
          test "$(git -C "$SPARKLE_SOURCE" rev-parse HEAD)" = "5581748cef2bae787496fe6d61139aebe0a451f6"
          xcodebuild \
            -project "$SPARKLE_SOURCE/Sparkle.xcodeproj" \
            -scheme sparkle-cli \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/sparkle-cli-build" \
            ARCHS="${{ matrix.host_arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            build
          PRODUCTS="$RUNNER_TEMP/sparkle-cli-build/Build/Products/Release"
          cp -R "$PRODUCTS/sparkle.app" "$RUNNER_TEMP/sparkle-cli.app"
          test "$(lipo -archs "$RUNNER_TEMP/sparkle-cli.app/Contents/MacOS/sparkle")" = "${{ matrix.host_arch }}"

      - name: Install public appcast verification dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/appcast-python"
          "$RUNNER_TEMP/appcast-python/bin/python" -m pip install --quiet 'cryptography==45.0.7'
          echo "$RUNNER_TEMP/appcast-python/bin" >> "$GITHUB_PATH"

      - name: Resolve and download published N-1 package
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/resolve_previous_release.py \
            --repo "${{ github.repository }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --channel "${{ matrix.channel }}" \
            --arch "${{ matrix.arch }}" \
            --output "$RUNNER_TEMP/previous.zip" \
            --bootstrap-tag "${{ vars.SPARKLE_UPDATE_BOOTSTRAP_TAG }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reject tampering, install candidate, and prove relaunch
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_SIGNING_CERTIFICATE_SHA256"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"
          ARGS=(
            --sparkle-cli "$RUNNER_TEMP/sparkle-cli.app/Contents/MacOS/sparkle"
            --candidate-zip "reviewed/${{ matrix.package_prefix }}-v${{ needs.prepare.outputs.version }}-macos-${{ matrix.arch }}.zip"
            --product-name "${{ matrix.product_name }}"
            --bundle-id "${{ matrix.bundle_id }}"
            --arch "${{ matrix.arch }}"
            --tag "${{ needs.prepare.outputs.tag }}"
            --signing-identity "$APPLE_SIGNING_IDENTITY"
            --team-id "$APPLE_TEAM_ID"
            --candidate-certificate-sha256 "$APPLE_SIGNING_CERTIFICATE_SHA256"
          )
          if [[ "${{ steps.previous.outputs.bootstrap }}" == "true" ]]; then
            ARGS+=(--bootstrap)
          else
            test -n "$APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256"
            ARGS+=(
              --previous-zip "$RUNNER_TEMP/previous.zip"
              --previous-certificate-sha256 "$APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256"
            )
          fi
          python3 scripts/release/sparkle_update_e2e.py "${ARGS[@]}"

  publish-release:
    needs:
      - prepare
      - create-draft-release
      - sparkle-update-e2e
    permissions:
      contents: write
    environment: ${{ needs.prepare.outputs.prerelease == 'true' && 'beta-release' || 'stable-release' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the verified draft without changing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = "true"
          gh release edit "$TAG" \
            --draft=false \
            --prerelease="$PRERELEASE" \
            --latest="$([[ "$PRERELEASE" == "true" ]] && echo false || echo true)" \
            --repo "$GH_REPO"

  prepare-sparkle-publication:
    needs:
      - prepare
      - publish-release
    permissions:
      contents: read
    environment: sparkle-signing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          path: release-source
          persist-credentials: false

      - name: Install public signature dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/appcast-python"
          "$RUNNER_TEMP/appcast-python/bin/python" -m pip install --quiet 'cryptography==45.0.7'
          echo "$RUNNER_TEMP/appcast-python/bin" >> "$GITHUB_PATH"

      - name: Update Sparkle appcast files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          python3 release-source/scripts/release/update_sparkle_appcasts.py \
            --repo "${{ github.repository }}" \
            --output-dir publication/appcasts \
            --changelog release-source/CHANGELOG.md \
            --public-key-plist release-source/Macsimize/Info.plist \
            --github-token "$GITHUB_TOKEN" \
            --require-signatures

      - name: Seal appcast publication bundle
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          files="$(find publication/appcasts -maxdepth 1 -type f -name '*.xml' -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$files" == 'beta-arm64.xml beta-x64.xml stable-arm64.xml stable-x64.xml' ]]
          (
            cd publication
            find appcasts -type f -name '*.xml' -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          printf '%s\n' \
            "Macsimize appcast publication bundle" \
            "release-tag=${TAG}" \
            "release-commit=${{ github.sha }}" \
            "destination=appcasts/" \
            "Apply these exact reviewed bytes manually after the release approval gate." \
            > publication/PUBLICATION.txt
      - name: Upload appcast publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macsimize-appcast-publication-${{ needs.prepare.outputs.tag }}
          path: publication
          if-no-files-found: error
          retention-days: 14

  generate-homebrew-casks:
    needs:
      - prepare
      - publish-release
      - prepare-sparkle-publication
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Macsimize
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Generate exact candidate casks once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reviewed-homebrew/Casks
          python3 scripts/release/update_homebrew_tap_casks.py \
            --tap-path reviewed-homebrew --repo apotenza92/macsimize
          casks="$(find reviewed-homebrew/Casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'macsimize.rb macsimize@beta.rb' ]]

      - name: Upload exact candidate casks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-homebrew-casks
          path: reviewed-homebrew/Casks
          if-no-files-found: error

  validate-homebrew-casks:
    needs:
      - prepare
      - generate-homebrew-casks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host_arch: arm64
          - runner: macos-15-intel
            host_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Checkout Macsimize
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Download exact candidate casks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-homebrew-casks
          path: reviewed-casks

      - name: Install candidate bytes into a real Homebrew tap
        run: |
          set -euo pipefail
          casks="$(find reviewed-casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'macsimize.rb macsimize@beta.rb' ]]
          brew tap apotenza92/tap
          tap_path="$(brew --repository apotenza92/tap)"
          cp reviewed-casks/macsimize.rb "$tap_path/Casks/macsimize.rb"
          cp reviewed-casks/macsimize@beta.rb "$tap_path/Casks/macsimize@beta.rb"
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew style --cask apotenza92/tap/macsimize apotenza92/tap/macsimize@beta
          brew audit --cask --online apotenza92/tap/macsimize apotenza92/tap/macsimize@beta

      - name: Install, assess, launch, and uninstall both casks
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          installed_cask=''
          cleanup() {
            if [[ -n "$installed_cask" ]]; then
              brew uninstall --cask "$installed_cask" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          smoke_app() {
            local app_path="$1"
            local executable_name="$2"
            local smoke_home
            smoke_home="$(mktemp -d "$RUNNER_TEMP/macsimize-brew-smoke.XXXXXX")"
            spctl --assess --type execute --verbose=4 "$app_path"
            env -i \
              HOME="$smoke_home" \
              TMPDIR="$smoke_home" \
              PATH="/usr/bin:/bin:/usr/sbin:/sbin" \
              LANG="en_US.UTF-8" \
              MACSIMIZE_TEST_SUITE=1 \
              MACSIMIZE_DEBUG_LOG=0 \
              "$app_path/Contents/MacOS/$executable_name" -ApplePersistenceIgnoreState YES &
            local pid=$!
            sleep 5
            kill -0 "$pid"
            kill -TERM "$pid"
            wait "$pid" || true
          }

          for cask in macsimize macsimize@beta; do
            installed_cask="apotenza92/tap/$cask"
            brew install --cask "$installed_cask"
            if [[ "$cask" == macsimize ]]; then
              app="/Applications/Macsimize.app"
              executable_name="Macsimize"
            else
              app="/Applications/Macsimize Beta.app"
              executable_name="Macsimize Beta"
            fi
            test -d "$app"
            xcrun stapler validate "$app"
            smoke_app "$app" "$executable_name"
            brew uninstall --cask "$installed_cask"
            installed_cask=''
            test ! -e "$app"
          done

  prepare-homebrew-publication:
    needs:
      - prepare
      - generate-homebrew-casks
      - validate-homebrew-casks
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Download exact casks validated on both native runners
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-homebrew-casks
          path: publication/Casks

      - name: Seal standard Homebrew publication bundle
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          casks="$(find publication/Casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'macsimize.rb macsimize@beta.rb' ]]
          gh release view "$TAG" --json assets > release-assets.json
          channel=stable
          [[ "$TAG" == *-beta.* ]] && channel=beta
          python3 scripts/release/build_homebrew_publication.py \
            --channel "$channel" --tag "$TAG" \
            --casks publication/Casks --release-assets release-assets.json \
            --output publication
          (
            cd publication
            find manifest.json Casks -type f -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          python3 scripts/create-homebrew-archive.py publication homebrew-publication.tar.gz

      - name: Verify exact pre-published attested bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir existing-bundle
          gh release download "$TAG" --pattern homebrew-publication.tar.gz --dir existing-bundle
          cmp homebrew-publication.tar.gz existing-bundle/homebrew-publication.tar.gz
          gh attestation verify existing-bundle/homebrew-publication.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Upload Homebrew publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macsimize-homebrew-publication-${{ needs.prepare.outputs.tag }}
          path: |
            publication
            homebrew-publication.tar.gz
          if-no-files-found: error
          retention-days: 14

  dispatch-homebrew-publication:
    needs:
      - prepare
      - prepare-homebrew-publication
    permissions:
      contents: read
    environment: homebrew-dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Mint dispatch-only tap token
        id: dispatcher
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2
        with:
          app-id: ${{ vars.HOMEBREW_DISPATCHER_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_DISPATCHER_PRIVATE_KEY }}
          owner: apotenza92
          repositories: homebrew-tap
          permission-contents: write
          permission-actions: read
      - name: Dispatch trusted publication
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TAP_REPOSITORY: apotenza92/homebrew-tap
        run: |
          set -euo pipefail
          correlation="${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${TAG}"
          jq -n --arg product macsimize --arg tag "$TAG" --arg release_commit "$GITHUB_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg correlation_id "$correlation" \
            '{event_type:"publish-homebrew-v1",client_payload:{product:$product,tag:$tag,release_commit:$release_commit,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,correlation_id:$correlation_id}}' |
            gh api --method POST "repos/$TAP_REPOSITORY/dispatches" --input -
